  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(S),iterations:N,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(I)},k,u(C));
  document.open();document.write(new TextDecoder().decode(pt));document.close();
}
let saved=null;try{saved=localStorage.getItem("dash_pw")}catch(e){}
if(saved)open_(saved).catch(()=>{try{localStorage.removeItem("dash_pw")}catch(e){}});
